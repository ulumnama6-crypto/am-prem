<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        /* ───────── RESET & BASE ───────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0d15;
            padding: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        /* ───────── ORBS (background glow) ───────── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 20s ease-in-out infinite alternate;
        }
        .orb--1 {
            width: 500px;
            height: 500px;
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.2), transparent 70%);
        }
        .orb--2 {
            width: 600px;
            height: 600px;
            bottom: -15%;
            right: -10%;
            background: radial-gradient(circle, rgba(120, 50, 255, 0.2), transparent 70%);
            animation-delay: -6s;
        }
        .orb--3 {
            width: 400px;
            height: 400px;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(0, 255, 200, 0.1), transparent 70%);
            animation-delay: -12s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(40px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 40px) scale(0.9);
            }
            100% {
                transform: translate(30px, -20px) scale(1.05);
            }
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        /* ───────── CARD ───────── */
        .card {
            position: relative;
            z-index: 10;
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 3rem;
            padding: 3rem 2.5rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            text-align: center;
        }

        /* ───────── SPINNER ───────── */
        .spinner-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .spinner {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.06);
            border-top-color: #4facfe;
            border-right-color: #7c3aed;
            animation: spin 1.2s cubic-bezier(0.6, 0, 0.4, 1) infinite;
            box-shadow: 0 0 30px rgba(79, 172, 254, 0.2);
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ───────── TYPOGRAPHY ───────── */
        .title {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f0f4ff 0%, #a0c8ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }
        .subtitle {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.7;
            max-width: 420px;
            margin: 0 auto 1.8rem;
        }
        .blink-text {
            display: inline-block;
            animation: blink 2s ease-in-out infinite;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 0.2;
            }
            50% {
                opacity: 1;
            }
        }

        /* ───────── WHATSAPP CHANNEL BUTTON ───────── */
        .wa-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 2rem;
            padding: 0.9rem 2.2rem;
            border-radius: 60px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #fff;
            font-weight: 600;
            font-size: 1.05rem;
            text-decoration: none;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.25);
            border: none;
            cursor: pointer;
            letter-spacing: 0.3px;
        }
        .wa-button:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 40px rgba(37, 211, 102, 0.4);
        }
        .wa-button:active {
            transform: scale(0.96);
        }

        .wa-button svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            fill: currentColor;
        }

        .wa-note {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 0.6rem;
            letter-spacing: 0.3px;
        }

        /* ───────── FOOTER ───────── */
        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        /* ───────── RESPONSIVE ───────── */
        @media (max-width: 640px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }
            .title {
                font-size: 2rem;
            }
            .subtitle {
                font-size: 0.95rem;
            }
            .wa-button {
                padding: 0.75rem 1.6rem;
                font-size: 0.95rem;
                gap: 10px;
            }
            .wa-button svg {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- orbs -->
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>
    <div class="grid-overlay"></div>

    <!-- main card -->
    <main class="card">

        <div class="spinner-wrap">
            <div class="spinner"></div>
        </div>

        <h1 class="title">Server Maintenance</h1>

        <p class="subtitle">
            Sedang dilakukan perbaikan pada sistem. Layanan akan kembali dalam beberapa saat. Harap bersabar.
        </p>

        <div class="blink-text">● dalam proses</div>

        <!-- ─── TOMBOL SALURAN WHATSAPP ─── -->
        <!-- GANTI "YOUR_CHANNEL_ID" dengan ID saluran WhatsApp asli Anda -->
        <a class="wa-button" href="https://whatsapp.com/channel/0029Vb8UPJqDzgTEfcxodd1v" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
            </svg>
            Ikuti Saluran WhatsApp
        </a>
        <div class="wa-note">Klik untuk mengikuti dan dapatkan info lebih lanjut</div>

        <div class="footer-note">
            <span>⚡</span>
            <span>🛡️</span>
            <span style="opacity:0.4;">v3.2</span>
        </div>

    </main>

</body>
</html>
